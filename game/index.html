<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bug Catcher</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-shell">
      <div class="game-header">
        <div>
          <p class="eyebrow">Coding break</p>
          <h1>Bug Catcher</h1>
        </div>
        <div class="header-actions">
          <button id="startButton" type="button" class="primary">Start</button>
          <button id="restartButton" type="button">Restart</button>
        </div>
      </div>

      <div class="scoreboard" aria-live="polite">
        <div><span>Score</span><strong id="scoreValue">0</strong></div>
        <div><span>Time</span><strong id="timeValue">45</strong></div>
      </div>

      <div id="gameArea" class="game-area" aria-label="Bug catching game">
        <div id="player" class="player" aria-label="Player">&gt;_</div>
      </div>

      <p id="statusText" class="status-text">Press Start and catch the bugs before they reach the stack.</p>
    </main>

    <script src="script.js"></script>
  </body>
</html>
