    <rect x="232" y="148" width="126" height="42" rx="12" fill="#111827" stroke="rgba(125,211,252,0.5)"/>
    <text x="255" y="175" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="12" letter-spacing="0.08em">TIME</text>
