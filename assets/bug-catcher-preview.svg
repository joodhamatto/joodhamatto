<svg width="1200" height="260" viewBox="0 0 1200 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bug Catcher game preview">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1120"/>
      <stop offset="0.52" stop-color="#111827"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accent" x1="130" y1="30" x2="1030" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7DD3FC"/>
      <stop offset="0.5" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="260" rx="24" fill="url(#bg)"/>
  <rect x="48" y="36" width="1104" height="188" rx="20" fill="#0F172A" stroke="rgba(148,163,184,0.36)"/>

  <g opacity="0.9">
    <circle cx="175" cy="72" r="42" fill="#0EA5E9" opacity="0.28"/>
    <circle cx="1020" cy="72" r="52" fill="#A78BFA" opacity="0.2"/>
    <circle cx="935" cy="170" r="48" fill="#34D399" opacity="0.18"/>
  </g>

  <g>
    <text x="85" y="92" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="1.2">BUG CATCHER</text>
    <text x="85" y="122" fill="#7DD3FC" font-family="Segoe UI, Arial, sans-serif" font-size="14" letter-spacing="2.4">CODING BREAK</text>

