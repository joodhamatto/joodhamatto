<svg width="1200" height="220" viewBox="0 0 1200 220" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Jood Hamatto profile header">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E2E8F0"/>
      <stop offset="0.55" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="accent" x1="180" y1="30" x2="980" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563EB"/>
      <stop offset="0.5" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="220" rx="24" fill="url(#bg)"/>

  <g opacity="0.72" filter="url(#blur)">
    <circle cx="190" cy="60" r="40" fill="#93C5FD"/>
    <circle cx="1040" cy="70" r="54" fill="#C4B5FD"/>
    <circle cx="960" cy="175" r="45" fill="#99F6E4"/>
  </g>

  <g opacity="0.95">
    <path d="M118 150C190 88 262 84 322 126C382 168 438 171 490 122C552 68 618 64 682 108C747 152 810 154 876 112C951 65 1038 70 1082 116" stroke="url(#accent)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="310" cy="128" r="10" fill="#2563EB">
      <animate attributeName="r" values="8;12;8" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="675" cy="109" r="10" fill="#7C3AED">
      <animate attributeName="r" values="8;12;8" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1016" cy="110" r="10" fill="#14B8A6">
      <animate attributeName="r" values="8;12;8" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g>
    <rect x="62" y="52" width="196" height="116" rx="18" fill="#0F172A" opacity="0.96"/>
    <text x="90" y="90" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">Jood Hamatto</text>
    <text x="90" y="122" fill="#BFDBFE" font-family="Segoe UI, Arial, sans-serif" font-size="14" letter-spacing="1.6">COMPUTER ENGINEERING</text>
    <text x="90" y="148" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="13">Software • Web • Mobile</text>
    <rect x="90" y="158" width="86" height="4" rx="2" fill="#60A5FA"/>
  </g>
</svg>
